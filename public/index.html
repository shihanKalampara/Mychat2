<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/api/icon.png?s=64">
<link rel="apple-touch-icon" href="/api/icon.png?s=180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Calculator</title>
<style>
:root{--bg:#EEF3F4;--panel:#fff;--line:#DCE6E8;--text:#10252B;--mute:#5E7880;--brand:#0E7C86;--soft:#E3F3F4;--in:#fff;--accent:#F5A524;--ok:#22C55E;--bad:#D64545;--out1:#0E7C86;--out2:#0A5F68;--sh:0 1px 2px rgba(16,37,43,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#0A1518;--panel:#102127;--line:#1C353C;--text:#E6F1F3;--mute:#8DA7AE;--brand:#2BB8C4;--soft:#14343A;--in:#17303A;--out1:#13808A;--out2:#0D5F68;--sh:none}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
.ico{width:22px;height:22px;display:block;flex:none}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--soft);color:var(--brand)}
.ib:disabled{opacity:.4;pointer-events:none}
.mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--out1),var(--out2));box-shadow:0 6px 16px rgba(14,124,134,.35)}
.mark .ico{width:28px;height:28px}
.mark.sm{width:32px;height:32px;border-radius:10px;box-shadow:none}.mark.sm .ico{width:18px;height:18px}
.mark.big{width:84px;height:84px;border-radius:24px;margin-bottom:16px}.mark.big .ico{width:40px;height:40px}
#auth{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 20% 0%,#14808A 0%,#0A3F47 55%,#071E24 100%)}
.card{width:100%;max-width:380px;background:var(--panel);border-radius:20px;padding:32px 26px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:16px}
.tag{color:var(--mute);margin:2px 0 22px}
.card input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--bg);transition:border-color .15s,background .15s}
.card input:focus{outline:0;border-color:var(--brand);background:var(--panel)}
.btn{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--out1),var(--out2));color:#fff;font-weight:700}
.btn:active{filter:brightness(.92)}
.link{display:block;margin:14px auto 0;color:var(--brand);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:16px;text-align:center}
.err{color:var(--bad);min-height:20px;margin-bottom:8px;font-size:14px}
#app{height:100dvh;display:grid;grid-template-columns:360px 1fr}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{position:relative;padding:calc(12px + env(safe-area-inset-top)) 12px 12px 16px;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.brand{flex:1;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.3px}
#menu,#cMenu{position:absolute;right:12px;top:calc(100% - 4px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:20;overflow:hidden;min-width:200px}
#menu button,#cMenu button{display:block;width:100%;padding:13px 18px;text-align:left;white-space:nowrap}
#menu button:hover,#cMenu button:hover{background:var(--soft)}
#list{overflow:auto;flex:1;padding:6px}
.row{display:flex;gap:12px;align-items:center;padding:10px;width:100%;text-align:left;border-radius:14px;transition:background .12s}
.row:hover,.row.on{background:var(--soft)}
.av{position:relative;flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--panel)}
.meta{flex:1;min-width:0}
.meta div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;font-size:14px}
.meta small .ico{width:16px;height:16px}
.badge{background:var(--brand);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:700;display:grid;place-items:center}
.empty{padding:36px 22px;color:var(--mute);text-align:center}
#pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
#head{position:relative;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 10px 10px;display:flex;align-items:center;gap:10px}
#back{display:none}
#none{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);padding:24px;text-align:center}
#none b{color:var(--text);font-size:20px;margin-bottom:4px}
#msgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:4px}
.m{align-self:flex-start;max-width:min(78%,520px);padding:9px 13px 7px;border-radius:18px 18px 18px 6px;background:var(--in);box-shadow:var(--sh);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--out1),var(--out2));color:#fff;border-radius:18px 18px 6px 18px}
.m i{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-style:normal;font-size:11px;opacity:.7;margin-top:3px}
.m i .ico{width:15px;height:15px}
.m i span{display:inline-flex}
.m.me .rd{color:#FFD27A}
.rep{opacity:.5;color:inherit;display:inline-grid;place-items:center}
.rep .ico{width:13px;height:13px}
.rep:hover{opacity:1}
.mimg{display:block;max-width:100%;max-height:320px;border-radius:12px;cursor:pointer;background:rgba(0,0,0,.08);min-width:140px;min-height:90px}
.play{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:999px;padding:8px 16px 8px 10px;font-weight:600;color:inherit}
.play .ico{width:18px;height:18px}
.m:not(.me) .play{background:var(--soft);color:var(--brand)}
#bar{display:flex;align-items:center;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#txt{flex:1;min-width:0;padding:12px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg)}
#txt:focus{outline:0;border-color:var(--brand)}
#txt:disabled{opacity:.5}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--out1),var(--out2))}
.send .ico{width:20px;height:20px;transform:translateX(-1px)}
#rec{display:none;flex:1;align-items:center;gap:10px}
#rec span{flex:1;color:var(--bad);font-weight:700}
#bar.recording>:not(#rec){display:none!important}
#bar.recording #rec{display:flex}
#bar.busy{opacity:.6;pointer-events:none}
#find{position:fixed;inset:0;background:rgba(7,30,36,.55);backdrop-filter:blur(4px);display:grid;place-items:start center;padding:8vh 16px;z-index:30}
#find .card{padding:18px;max-height:80vh;overflow:auto}
#view{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:40}
#view img{max-width:100%;max-height:100%}
@media(max-width:720px){#app{grid-template-columns:1fr}#pane{display:none}#app.open #side{display:none}#app.open #pane{display:flex}#back{display:grid}}
#calc{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px calc(16px + env(safe-area-inset-bottom));z-index:50;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#cHint{color:#8d8d93;font-size:14px;text-align:center;min-height:20px;padding-bottom:8px}
#cExp{color:#8d8d93;text-align:right;font-size:20px;min-height:28px;overflow:hidden;white-space:nowrap}
#cOut{text-align:right;font-size:72px;font-weight:300;line-height:1.1;overflow:hidden;white-space:nowrap;padding-bottom:14px}
#cKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px;width:100%;margin:0 auto}
#cKeys button{aspect-ratio:1;border-radius:50%;font-size:30px;background:#333;color:#fff;display:grid;place-items:center}
#cKeys button:active{filter:brightness(1.4)}
#cKeys .fn{background:#a5a5a5;color:#000}
#cKeys .op{background:#ff9f0a}
#cKeys .zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;place-items:center start;padding-left:28px}
#cExp,#cOut{max-width:420px;width:100%;margin-left:auto;margin-right:auto}
</style>
</head>
<body>

<div id="calc"><div id="cHint"></div><div id="cExp"></div><div id="cOut">0</div><div id="cKeys"></div></div>

<div id="auth" class="hide">
 <form class="card" id="authForm">
  <div class="mark" data-ico="chat"></div>
  <div class="logo">MyChat</div>
  <div class="tag">Simple, private messaging.</div>
  <input id="aName" placeholder="Your name" autocomplete="name">
  <input id="aPhone" placeholder="Phone number" inputmode="tel" autocomplete="tel">
  <input id="aPass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="err" id="aErr" role="alert"></div>
  <button class="btn" id="aGo" type="submit">Create account</button>
  <p class="note">Messages are private. Only a message that someone reports can be reviewed by the admin.</p>
  <button class="link" id="aSwap" type="button">I already have an account</button>
 </form>
</div>

<div id="app" class="hide">
 <aside id="side">
  <div class="top"><div class="brand"><span class="mark sm" data-ico="chat"></span>MyChat</div><button class="ib" id="newBtn" aria-label="New chat" data-ico="edit"></button><button class="ib" id="lockBtn" aria-label="Lock" data-ico="lock"></button><button class="ib" id="moreBtn" aria-label="More options" data-ico="more"></button><div id="menu" class="hide"><button id="statusBtn">Activity status: On</button><button id="codeBtn">Change code</button><button id="outBtn">Log out</button></div></div>
  <div id="list"></div>
 </aside>
 <main id="pane">
  <div id="none"><div class="mark big" data-ico="chat"></div><b>Your messages</b><p>Select a chat, or start a new one with a phone number.</p></div>
  <div id="chat" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
   <div id="head"><button class="ib" id="back" aria-label="Back to chats" data-ico="back"></button><div class="av" id="hAv"></div><div class="meta"><b id="hName"></b><small id="hSub"></small></div><button class="ib" id="cMore" aria-label="Chat options" data-ico="more"></button><div id="cMenu" class="hide"><button id="blkBtn">Block user</button></div></div>
   <div id="msgs"></div>
   <form id="bar"><button type="button" class="ib" id="attBtn" aria-label="Send a photo" data-ico="image"></button><input type="file" id="file" accept="image/*" hidden><input id="txt" placeholder="Message" autocomplete="off"><button type="button" class="ib" id="micBtn" aria-label="Record a voice message" data-ico="mic"></button><button type="submit" class="send" aria-label="Send message" data-ico="send"></button><div id="rec"><button type="button" class="ib" id="recCancel" aria-label="Cancel recording" data-ico="x"></button><span id="recT">● 0:00</span><button type="button" class="send" id="recSend" aria-label="Send voice message" data-ico="send"></button></div></form>
  </div>
 </main>
</div>

<div id="view" class="hide"><img id="viewImg" alt=""></div>

<div id="find" class="hide">
 <div class="card">
  <input id="q" placeholder="Search by name or phone number" autocomplete="off">
  <div id="res"></div>
  <button class="link" id="closeFind" type="button">Close</button>
 </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#3A3CA6','#1F8A70','#C2410C','#9333EA','#0E7490','#B45309','#BE185D'];
const color = p => COLORS[[...p].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const hm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const ICONS = {
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  more: '<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>',
  back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  mic: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>',
  send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  play: '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  check2: '<path d="M2 12l5 5L17 7"/><path d="M12 16l1.5 1.5L22 7"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const tick = s => ico(s === 'sent' ? 'check' : 'check2');

let S = { locked: true, token: localStorage.token, me: JSON.parse(localStorage.me || 'null'), chats: [], cur: null, msgs: [], mode: 'register', timer: null, busy: false, sig: '', unread: 0 };

async function api(p, body) {
  const r = await fetch('/api/' + p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && S.token) logout(); throw new Error(j.error || 'Something went wrong'); }
  return j;
}

function showAuth() {
  $('#app').classList.add('hide'); $('#auth').classList.remove('hide');
  const reg = S.mode === 'register';
  $('#aName').classList.toggle('hide', !reg);
  $('#aGo').textContent = reg ? 'Create account' : 'Log in';
  $('#aSwap').textContent = reg ? 'I already have an account' : 'Create a new account';
  $('#aErr').textContent = '';
}
$('#aSwap').onclick = () => { S.mode = S.mode === 'register' ? 'login' : 'register'; showAuth(); };
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  try {
    const j = await api(S.mode, { name: $('#aName').value, phone: $('#aPhone').value, password: $('#aPass').value });
    S.token = localStorage.token = j.token; S.me = j.user; localStorage.me = JSON.stringify(j.user);
    start();
  } catch (err) { $('#aErr').textContent = err.message; }
};
function logout() {
  const kc = localStorage.code; localStorage.clear(); if (kc) localStorage.code = kc; S.token = null; S.me = null; S.cur = null; clearTimeout(S.timer);
  S.mode = 'login'; showAuth();
}
$('#outBtn').onclick = logout;

function start() {
  $('#auth').classList.add('hide'); $('#app').classList.remove('hide');
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  sync();
}

async function sync() {
  if (!S.token || S.busy || S.locked) return;
  S.busy = true; clearTimeout(S.timer);
  try {
    const qs = []; if (S.cur) qs.push('peer=' + S.cur.phone); if (document.hidden) qs.push('bg=1');
    const r = await api('sync' + (qs.length ? '?' + qs.join('&') : ''));
    S.showStatus = r.showStatus; $('#statusBtn').textContent = 'Activity status: ' + (r.showStatus ? 'On' : 'Off');
    const total = r.chats.reduce((a, c) => a + c.unread, 0);
    if (total > S.unread && document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification('Calculator', { body: 'New message' });
    S.unread = total;
    const sig = JSON.stringify(r.chats);
    if (sig !== S.sig) { S.chats = r.chats; S.sig = sig; drawList(); }
    if (S.cur) {
      const ms = JSON.stringify(r.msgs);
      S.cur.online = r.online; S.cur.iBlocked = r.iBlocked;
      drawHead();
      if (ms !== S.msigs) { S.msgs = r.msgs; S.msigs = ms; drawMsgs(); }
    }
  } catch {}
  S.busy = false;
  S.timer = setTimeout(sync, document.hidden ? 8000 : 2500);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(S.timer); sync(); } });

function drawList() {
  const el = $('#list');
  if (!S.chats.length) { el.innerHTML = '<div class="empty">No chats yet.<br>Tap the pencil icon to find a friend by name or phone number.</div>'; return; }
  el.innerHTML = S.chats.map(c => `
    <button class="row ${S.cur && S.cur.phone === c.user.phone ? 'on' : ''}" data-p="${esc(c.user.phone)}">
      <span class="av ${c.online ? 'on' : ''}" style="background:${color(c.user.phone)}">${esc(c.user.name[0].toUpperCase())}</span>
      <span class="meta"><div><b>${esc(c.user.name)}</b><small>${hm(c.last.ts)}</small></div>
      <div><small>${c.last.from === S.me.phone ? tick(c.last.status) + ' ' : ''}${esc(preview(c.last))}</small>${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div></span>
    </button>`).join('');
  el.querySelectorAll('.row').forEach(b => b.onclick = () => openChat(b.dataset.p));
}

async function openChat(phone, name) {
  const known = S.chats.find(c => c.user.phone === phone);
  S.cur = { phone, name: (known && known.user.name) || name || phone, online: false };
  S.msgs = []; S.msigs = '';
  $('#none').classList.add('hide'); $('#chat').classList.remove('hide');
  $('#app').classList.add('open');
  drawHead(); drawMsgs(); drawList();
  clearTimeout(S.timer); S.busy = false; await sync();
  $('#txt').focus();
}

function drawHead() {
  if (!S.cur) return;
  $('#hAv').textContent = S.cur.name[0].toUpperCase(); $('#hAv').style.background = color(S.cur.phone); $('#hAv').classList.toggle('on', !!S.cur.online);
  $('#hName').textContent = S.cur.name;
  $('#hSub').textContent = S.cur.iBlocked ? 'blocked' : S.cur.online ? 'online' : '+' + S.cur.phone;
  $('#blkBtn').textContent = S.cur.iBlocked ? 'Unblock user' : 'Block user';
  $('#txt').disabled = !!S.cur.iBlocked; $('#txt').placeholder = S.cur.iBlocked ? 'You blocked this user' : 'Type a message';
  $('#attBtn').disabled = $('#micBtn').disabled = !!S.cur.iBlocked;
}

function drawMsgs() {
  const el = $('#msgs');
  el.innerHTML = S.msgs.map(m => {
    const me = m.from === S.me.phone;
    return `<div class="m ${me ? 'me' : ''}">${body(m)}<i>${hm(m.ts)}${me ? ` <span class="${m.status === 'read' ? 'rd' : ''}">${tick(m.status)}</span>` : ` <button class="rep" data-id="${m.id}" aria-label="Report message">${ico('flag')}</button>`}</i></div>`;
  }).join('');
  hydrate(el);
  el.scrollTop = el.scrollHeight;
}

$('#bar').onsubmit = async e => {
  e.preventDefault();
  const text = $('#txt').value.trim();
  if (!text || !S.cur) return;
  $('#txt').value = '';
  try {
    const m = await api('send', { to: S.cur.phone, text });
    S.msgs.push(m); S.msigs = JSON.stringify(S.msgs); drawMsgs();
    clearTimeout(S.timer); S.busy = false; sync();
  } catch (err) { alert(err.message); $('#txt').value = text; }
};
$('#back').onclick = () => { $('#app').classList.remove('open'); S.cur = null; S.sig = ''; sync(); };

$('#newBtn').onclick = () => { $('#find').classList.remove('hide'); $('#q').value = ''; $('#res').innerHTML = '<div class="empty">Type a name or phone number.</div>'; $('#q').focus(); };
$('#closeFind').onclick = () => $('#find').classList.add('hide');
let qT;
$('#q').oninput = () => {
  clearTimeout(qT);
  qT = setTimeout(async () => {
    const t = $('#q').value.trim(); if (!t) return;
    const r = await api('users?q=' + encodeURIComponent(t));
    $('#res').innerHTML = r.length ? r.map(u => `
      <button class="row" data-p="${esc(u.phone)}" data-n="${esc(u.name)}"><span class="av" style="background:${color(u.phone)}">${esc(u.name[0].toUpperCase())}</span>
      <span class="meta"><b>${esc(u.name)}</b><small>+${esc(u.phone)}</small></span></button>`).join('')
      : '<div class="empty">No one found. Ask your friend to create an account first.</div>';
    $('#res').querySelectorAll('.row').forEach(b => b.onclick = () => { $('#find').classList.add('hide'); openChat(b.dataset.p, b.dataset.n); });
  }, 250);
};

/* ---------- calculator lock ---------- */
/*EVAL*/
function calcEval(e) {
  const t = e.match(/-?\d+\.?\d*|-?\.\d+|[+−×÷]/g) || [];
  const n = [], o = [];
  for (const x of t) { if (/^[+−×÷]$/.test(x)) o.push(x); else n.push(parseFloat(x)); }
  if (!n.length) return '0';
  while (o.length >= n.length) o.pop();
  const nn = [n[0]], oo = [];
  for (let i = 0; i < o.length; i++) {
    if (o[i] === '×') nn[nn.length - 1] *= n[i + 1];
    else if (o[i] === '÷') { if (n[i + 1] === 0) return 'Error'; nn[nn.length - 1] /= n[i + 1]; }
    else { oo.push(o[i]); nn.push(n[i + 1]); }
  }
  let r = nn[0];
  oo.forEach((op, i) => { r = op === '+' ? r + nn[i + 1] : r - nn[i + 1]; });
  if (!isFinite(r)) return 'Error';
  return String(parseFloat(r.toPrecision(12)));
}
/*END*/
async function sha(s) {
  if (!(window.crypto && crypto.subtle)) return 'x' + btoa('mychat:' + s);
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mychat:' + s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
let ce = '', cDone = false, cPend = '';
const cHint = t => $('#cHint').textContent = t;
function cShow() {
  $('#cOut').textContent = ce || '0';
  const l = (ce || '0').length;
  $('#cOut').style.fontSize = l > 10 ? '40px' : l > 7 ? '54px' : '72px';
}
function cClear() { ce = ''; cDone = false; cPend = ''; $('#cExp').textContent = ''; cShow(); }
const CKEYS = [['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],['.'],['=','op']];
$('#cKeys').innerHTML = CKEYS.map(([k, c]) => `<button class="${c || ''}" data-k="${k}" aria-label="${k}">${k}</button>`).join('');
$('#cKeys').onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); };

async function press(k) {
  if (ce === 'Error') ce = '';
  if (/^\d$/.test(k)) { if (cDone) { ce = ''; cDone = false; $('#cExp').textContent = ''; } ce += k; }
  else if (k === '.') {
    if (cDone) { ce = ''; cDone = false; $('#cExp').textContent = ''; }
    const m = ce.match(/[\d.]*$/)[0];
    if (!m.includes('.')) ce += m === '' ? '0.' : '.';
  }
  else if (/^[+−×÷]$/.test(k)) {
    cDone = false;
    if (ce === '') ce = k === '−' ? '-' : '0' + k;
    else if (ce === '-') {}
    else if (/[+−×÷]$/.test(ce)) ce = ce.slice(0, -1) + k;
    else ce += k;
  }
  else if (k === 'AC') { cClear(); return; }
  else if (k === '±') {
    const m = ce.match(/-?[\d.]*$/);
    if (m && m[0] && m[0] !== '-') ce = ce.slice(0, ce.length - m[0].length) + (m[0][0] === '-' ? m[0].slice(1) : '-' + m[0]);
    else if (ce === '') ce = '-';
  }
  else if (k === '%') {
    const m = ce.match(/-?[\d.]+$/);
    if (m) ce = ce.slice(0, ce.length - m[0].length) + String(parseFloat((parseFloat(m[0]) / 100).toPrecision(12)));
  }
  else if (k === '=') {
    if (/^\d+$/.test(ce)) {
      const h = await sha(ce), code = localStorage.code;
      if (code) { if (h === code) { cClear(); unlock(); return; } }
      else if (ce.length >= 4 && ce.length <= 8) {
        if (!cPend) { cPend = h; cHint('Enter the same code again, then press ='); ce = ''; cShow(); return; }
        if (cPend === h) { localStorage.code = h; cClear(); cHint(''); unlock(); return; }
        cPend = ''; cHint('Codes did not match. Try again.'); ce = ''; cShow(); return;
      }
    }
    const r = calcEval(ce); $('#cExp').textContent = ce; ce = r; cDone = true;
  }
  cShow();
}

function lock() {
  stopRec(true); clearMedia(); S.locked = true; clearTimeout(S.timer); S.busy = false; S.cur = null; S.chats = []; S.msgs = []; S.sig = ''; S.msigs = '';
  $('#list').innerHTML = ''; $('#msgs').innerHTML = '';
  $('#chat').classList.add('hide'); $('#none').classList.remove('hide');
  ['#app', '#auth', '#find', '#menu', '#cMenu'].forEach(i => $(i).classList.add('hide'));
  $('#app').classList.remove('open'); $('#authForm').reset();
  cClear(); cHint(localStorage.code ? '' : 'Set a secret code: type 4–8 digits, then press =');
  document.title = 'Calculator'; $('#calc').classList.remove('hide');
}
function unlock() {
  S.locked = false; $('#calc').classList.add('hide'); document.title = 'MyChat';
  S.token && S.me ? start() : showAuth();
}
$('#lockBtn').onclick = lock;
$('#moreBtn').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('hide'); };
document.addEventListener('click', () => { $('#menu').classList.add('hide'); $('#cMenu').classList.add('hide'); });
$('#codeBtn').onclick = () => { localStorage.removeItem('code'); lock(); };
let awayAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) awayAt = Date.now();
  else if (!S.locked && awayAt && Date.now() - awayAt > 30000) lock();
});

$('#cMore').onclick = e => { e.stopPropagation(); $('#cMenu').classList.toggle('hide'); };
$('#blkBtn').onclick = async () => {
  if (!S.cur) return;
  const block = !S.cur.iBlocked;
  if (block && !confirm('Block ' + S.cur.name + '? They will not be able to message you.')) return;
  try { await api('block', { phone: S.cur.phone, block }); S.cur.iBlocked = block; drawHead(); } catch (e) { alert(e.message); }
  $('#cMenu').classList.add('hide');
};
$('#msgs').onclick = async e => {
  const pl = e.target.closest('.play'); if (pl) { togglePlay(pl); return; }
  const im = e.target.closest('.mimg'); if (im) { viewImg(im); return; }
  const b = e.target.closest('.rep'); if (!b) return;
  if (!confirm('Report this message? The admin will be able to read it and a few messages before it.')) return;
  const block = confirm('Also block this user?');
  try { await api('report', { messageId: b.dataset.id, block }); if (block && S.cur) { S.cur.iBlocked = true; drawHead(); } alert('Reported. Thank you.'); }
  catch (err) { alert(err.message); }
};

$('#statusBtn').onclick = async () => {
  try { await api('status', { show: !S.showStatus }); S.showStatus = !S.showStatus; S.sig = ''; clearTimeout(S.timer); S.busy = false; sync(); }
  catch (e) { alert(e.message); }
};

/* ---------- photos & voice messages ---------- */
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const preview = l => l.kind === 'image' ? 'Photo' : l.kind === 'audio' ? 'Voice message' : l.text;
const body = m => m.kind === 'image' ? `<img class="mimg" data-media="${esc(m.media)}" alt="Photo">`
  : m.kind === 'audio' ? `<button class="play" data-media="${esc(m.media)}">${ico('play')}<span>${fmt(m.dur || 0)}</span></button>` : esc(m.text);

const blobs = {};
function mediaUrl(id) {
  if (!blobs[id]) blobs[id] = fetch('/api/media/' + id, { headers: { Authorization: 'Bearer ' + S.token } })
    .then(r => { if (!r.ok) throw 0; return r.blob(); }).then(b => URL.createObjectURL(b)).catch(() => { delete blobs[id]; return null; });
  return blobs[id];
}
function clearMedia() {
  Object.values(blobs).forEach(p => p.then(u => u && URL.revokeObjectURL(u)));
  for (const k in blobs) delete blobs[k];
  if (S.audio) { S.audio.pause(); S.audio = null; S.audioId = null; }
  $('#view').classList.add('hide'); $('#viewImg').removeAttribute('src');
}
function hydrate(el) {
  el.querySelectorAll('img[data-media]').forEach(img => mediaUrl(img.dataset.media).then(u => {
    if (u) { img.onload = () => { el.scrollTop = el.scrollHeight; }; img.src = u; }
  }));
}
async function togglePlay(btn) {
  const id = btn.dataset.media;
  if (S.audio && S.audioId === id) { if (S.audio.paused) S.audio.play(); else S.audio.pause(); return; }
  if (S.audio) S.audio.pause();
  const u = await mediaUrl(id);
  if (!u) { alert('Could not load this voice message'); return; }
  const a = new Audio(u); S.audio = a; S.audioId = id;
  const set = t => document.querySelectorAll('.play').forEach(b => { if (b.dataset.media === id) b.innerHTML = t; });
  a.onplay = () => set(ico('pause') + '<span>Playing</span>');
  a.onpause = a.onended = () => set(ico('play') + '<span>Play</span>');
  a.play().catch(() => {});
}
function viewImg(im) { if (!im.src) return; $('#viewImg').src = im.src; $('#view').classList.remove('hide'); }
$('#view').onclick = () => $('#view').classList.add('hide');

async function sendMedia(blob, dur) {
  if (!S.cur) return;
  $('#bar').classList.add('busy');
  try {
    const r = await fetch('/api/sendmedia?to=' + S.cur.phone + '&dur=' + (dur || 0), {
      method: 'POST', headers: { 'Content-Type': blob.type, Authorization: 'Bearer ' + S.token }, body: blob });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Could not send. The file may be too large.');
    S.msgs.push(j); S.msigs = JSON.stringify(S.msgs); drawMsgs();
    clearTimeout(S.timer); S.busy = false; sync();
  } catch (e) { alert(e.message); }
  $('#bar').classList.remove('busy');
}

$('#attBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !S.cur) return;
  try {
    const bmp = await createImageBitmap(f);
    const sc = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
    await sendMedia(blob);
  } catch { alert('Could not read that image'); }
};

let rec = null;
async function startRec() {
  if (!S.cur || rec) return;
  if (!(navigator.mediaDevices && window.MediaRecorder)) { alert('Voice recording is not supported in this browser'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mt = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const mr = new MediaRecorder(stream, mt ? { mimeType: mt, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
    const r = { mr, chunks: [], t0: Date.now(), send: false, tm: null };
    rec = r;
    mr.ondataavailable = e => { if (e.data.size) r.chunks.push(e.data); };
    mr.onstop = () => {
      clearInterval(r.tm); stream.getTracks().forEach(t => t.stop()); rec = null;
      $('#bar').classList.remove('recording');
      const secs = Math.round((Date.now() - r.t0) / 1000);
      if (r.send && r.chunks.length && secs >= 1) sendMedia(new Blob(r.chunks, { type: mr.mimeType || mt || 'audio/mp4' }), secs);
    };
    mr.start();
    $('#recT').textContent = '● 0:00'; $('#bar').classList.add('recording');
    r.tm = setInterval(() => {
      if (!rec) return;
      const s = Math.round((Date.now() - r.t0) / 1000);
      $('#recT').textContent = '● ' + fmt(s);
      if (s >= 120) stopRec(false);
    }, 500);
  } catch { alert('Allow microphone access to record a voice message.'); }
}
function stopRec(cancel) {
  if (!rec) return;
  rec.send = !cancel;
  try { if (rec.mr.state !== 'inactive') rec.mr.stop(); } catch {}
}
$('#micBtn').onclick = startRec;
$('#recSend').onclick = () => stopRec(false);
$('#recCancel').onclick = () => stopRec(true);

document.querySelectorAll('[data-ico]').forEach(e => { e.innerHTML = ico(e.dataset.ico); });

lock();
</script>
